[package]
name = "lite-recorder"
version = "0.1.0"
edition = "2024"

[dependencies]
windows-capture = "=2.0.1"
wasapi = "=0.27.0"
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_System_Performance", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security", "Media_Editing"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
